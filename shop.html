<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>দয়াল শপ – শীতের সোয়েটার, জ্যাকেট ও কিচেন চপার</title><meta name="description" content="দয়াল শপ: সোয়েটার, বোম্বার জ্যাকেট, সোয়েটশার্ট ও কিচেন চপার। সারা দেশে ডেলিভারি, ঘরে বসে অর্ডার করুন।"><meta name="theme-color" content="#1c2a4a"><meta property="og:type" content="website"><meta property="og:title" content="দয়াল শপ"><meta property="og:description" content="সোয়েটার, জ্যাকেট ও কিচেন চপার। সারা দেশে ডেলিভারি।">
<style>
:root{--bg:#f2f6fc;--sf:#fff;--ink:#1c2a4a;--mu:#56627f;--ln:#d9e2f1;--ac:#2f7bd9;--ai:#fff;--hl:#f2c94c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a30;--sf:#182545;--ink:#eaf0fb;--mu:#a2b0cf;--ln:#2a3a63;--ac:#5aa0f0;--ai:#0d1730}}
:root[data-theme="dark"]{--bg:#101a30;--sf:#182545;--ink:#eaf0fb;--mu:#a2b0cf;--ln:#2a3a63;--ac:#5aa0f0;--ai:#0d1730}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Noto Sans Bengali','Segoe UI',Roboto,sans-serif;line-height:1.55;padding-bottom:80px}
button,input,select,textarea{font:inherit;color:inherit}
.w{max-width:900px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:1px solid var(--ln)}
header .w{display:flex;align-items:center;justify-content:space-between;height:60px}
header img{height:44px;background:#fff;border-radius:8px}
.cb{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:500}
.ban{background:var(--ink);color:var(--bg);text-align:center;font-size:.9rem;padding:6px 12px}
.hero{padding:28px 0 8px}.hero h1{margin:0 0 4px;font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.25}.hero p{margin:0;color:var(--mu)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0}.tab{flex:none;border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:2px 16px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ac);color:var(--ai);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card .im{width:100%;aspect-ratio:1;object-fit:cover;background:#fff;cursor:pointer}
.ci{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}.ci h3{margin:0;font-size:1rem;font-weight:500;cursor:pointer}
.pr{font-weight:700;color:var(--ac)}
.btn{display:block;width:100%;text-align:center;text-decoration:none;background:var(--ac);color:var(--ai);border:0;border-radius:10px;padding:10px;font-weight:700;cursor:pointer;margin-top:8px}
.btn.o{background:var(--sf);color:var(--ink);border:1px solid var(--ln)}.btn.wa{background:#1fa855;color:#fff}
.card .btn{margin-top:auto}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.soon{margin:20px 0;padding:14px;border:1px dashed var(--ln);border-radius:12px;text-align:center;color:var(--mu)}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto;z-index:6;display:none}
.bar button{margin:0;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10}.scrim.open{display:block}
.pn{position:fixed;right:0;top:0;bottom:0;width:min(480px,100%);background:var(--bg);z-index:11;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pn.open{transform:none}@media(prefers-reduced-motion:reduce){.pn{transition:none}}
.ph{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--ln)}.ph h2{margin:0;font-size:1.15rem}
.x{background:none;border:0;font-size:1.6rem;cursor:pointer;line-height:1}
.pb{flex:1;overflow-y:auto;padding:16px}.pf{padding:12px 16px;border-top:1px solid var(--ln)}.pf .btn{margin:0 0 8px}.pf .btn:last-child{margin:0}
.big{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#fff;border:1px solid var(--ln)}
.th{display:flex;gap:8px;margin:8px 0;overflow-x:auto}.th button{flex:none;width:56px;height:56px;padding:0;border:2px solid var(--ln);border-radius:8px;overflow:hidden;background:#fff;cursor:pointer}
.th button[aria-pressed="true"]{border-color:var(--ac)}.th img{width:100%;height:100%;object-fit:cover}
ul.f{padding-left:20px;color:var(--mu)}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.row img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#fff}.row .t{flex:1;font-size:.95rem;line-height:1.35}
.q{display:flex;align-items:center;gap:8px}.q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);cursor:pointer}
label{display:block;font-size:.9rem;margin:12px 0 4px;font-weight:500}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--sf)}
.sum{margin:16px 0}.sum div{display:flex;justify-content:space-between}.sum .t{font-weight:700;font-size:1.1rem;border-top:1px solid var(--ln);padding-top:8px;margin-top:6px}
.note{background:var(--sf);border:1px dashed var(--ac);border-radius:8px;padding:8px 12px;font-size:.92rem;margin-top:8px}
.er{color:#d23b5a;font-size:.9rem;min-height:1.3em}
pre{white-space:pre-wrap;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:12px;font-family:inherit;font-size:.9rem}
footer{padding:24px 0;color:var(--mu);font-size:.9rem;border-top:1px solid var(--ln);margin-top:24px}
.hc{display:flex;align-items:center;gap:8px}.ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--ln);text-decoration:none;font-size:1.1rem}.ic.wa{background:#1fa855;border-color:#1fa855}.szr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}.sz{min-width:44px;height:36px;border:1px solid var(--ln);background:var(--sf);border-radius:8px;cursor:pointer}.sz[aria-pressed="true"]{background:var(--ac);color:var(--ai);border-color:var(--ac)}.cr{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cr .btn{margin:0}footer a{color:var(--ac)}</style></head><body>
